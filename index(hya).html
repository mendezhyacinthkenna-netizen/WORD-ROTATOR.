<!DOCTYPE html>
<html>
<head>
<title>Word - Integrity</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* Background design */
body{
  background-image: url('aa.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;

  margin:0;
  padding:0;
  font-family: serif;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* Center container */
.container{
  display:flex;
  justify-content:center;
  align-items:center;
  width:100%;
}

/* Word design */
p{
  border:4px solid green;
  color:red;
  font-size:80px;
  text-align:center;
  padding:30px 60px;
  background-color: rgba(255,255,255,0.75);
  border-radius:15px;
  margin:0;
}

/* Navigation container */
.nav{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:25px;
  font-size:22px;
  margin-top:30px;
  flex-wrap:wrap;
}

/* Navigation buttons */
.nav a{
  text-decoration:none;
  color:white;
  background:green;
  padding:10px 25px;
  border-radius:25px;
  font-weight:bold;
  transition:0.3s;
}

.nav a:hover{
  background:darkgreen;
  transform:scale(1.08);
}

/* Responsive for smaller screens */
@media (max-width:768px){

p{
  font-size:50px;
  padding:20px 30px;
}

.nav{
  gap:10px;
}

.nav a{
  font-size:18px;
  padding:8px 18px;
}

}

</style>

</head>

<body>

<div class="container">
<p>Integrity</p>
</div>

<div class="nav">
<a href="index(hya).html">WORD</a>
<a href="definition(hya).html">DEFINITION</a>
<a href="sentence(hya).html">SENTENCE</a>
</div>

<script>
// List of pages to loop
const pages = ["index(hya).html", "definition(hya).html", "sentence(hya).html"];

// Time to show each page (15 seconds)
const displayTime = 15000;

// Get current page
let currentIndex = pages.indexOf(window.location.pathname.split("/").pop());

// Go to next page
setTimeout(() => {
let nextIndex = (currentIndex + 1) % pages.length;
window.location.href = pages[nextIndex];
}, displayTime);

</script>

</body>
</html>
